syntax = "proto3";

package overbabel.vision;

service VisionService {
  rpc StreamTranslations(StreamRequest) returns (stream TranslationBatch);
  rpc ReloadEngine(ReloadEngineRequest) returns (ReloadEngineReply);
}

message StreamRequest {
  bool enable_ocr = 1;
}

message TranslationBatch {
  repeated TranslationItem items = 1;
  uint64 frame_id = 2;
}

message TranslationItem {
  int32 x = 1;
  int32 y = 2;
  int32 w = 3;
  int32 h = 4;
  string tag = 5;
  string text = 6;
  bool accent = 7;
}

message ReloadEngineRequest {
  string ocr_engine = 1;
  string translate_engine = 2;
}

message ReloadEngineReply {
  bool ok = 1;
  string message = 2;
}
