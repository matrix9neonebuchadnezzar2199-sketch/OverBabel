syntax = "proto3";

package overbabel.audio;

service AudioService {
  rpc StreamSubtitles(StreamRequest) returns (stream SubtitleBatch);
  rpc Ping(PingRequest) returns (PingReply);
}

message StreamRequest {}

message SubtitleBatch {
  string text = 1;
  string translated = 2;
}

message PingRequest {}

message PingReply {
  bool ok = 1;
}
